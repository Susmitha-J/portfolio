<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Starry Wave Section</title>

<style>
html,body{
  margin:0;
  background:#020617;
  font-family:system-ui;
  overflow-x:hidden;
}

.spacer{
  min-height:35vh;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#e5e7eb;
  opacity:.8;
}

.art-break{
  width:100vw;
  margin-left:calc(50% - 50vw);
  height:600px;
  position:relative;
  overflow:hidden;
}

svg{
  width:100%;
  height:100%;
  display:block;
}

.label{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  pointer-events:none;
}

.pill{
  font-size:13px;
  letter-spacing:.12em;
  text-transform:uppercase;
  padding:10px 16px;
  border-radius:999px;
  border:1px solid rgba(148,163,184,.2);
  background:rgba(2,6,23,.5);
  backdrop-filter:blur(8px);
  color:white;
}
</style>
</head>

<body>

<div class="spacer">Wave-shaped section (fixed version).</div>

<section class="art-break">
<svg viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid slice">

  <defs>

    <!-- Motion filter -->
    <filter id="skyFlow">
      <feTurbulence type="fractalNoise"
        baseFrequency="0.004 0.008"
        numOctaves="2"
        seed="3"
        result="noise">
        <animate attributeName="baseFrequency"
          dur="14s"
          values="0.004 0.008;
                  0.006 0.010;
                  0.004 0.007;
                  0.003 0.006;
                  0.004 0.008"
          repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="22"/>
    </filter>

    <!-- Sky clip -->
    <clipPath id="clipSky">
      <rect x="0" y="0" width="1000" height="430"/>
    </clipPath>

    <!-- Pixel-based wave clip (SAFE) -->
    <clipPath id="waveClip">
      <path d="
        M 0 80
        C 150 10 350 10 500 80
        C 650 150 850 150 1000 80
        L 1000 520
        C 850 590 650 590 500 520
        C 350 450 150 450 0 520
        Z
      "/>
    </clipPath>

  </defs>

  <g clip-path="url(#waveClip)">

    <!-- Base -->
    <image href="starry-night.png"
           x="-80" y="-60"
           width="1160"
           height="720"/>

    <!-- Sky motion -->
    <g clip-path="url(#clipSky)" opacity="0.6">
      <image href="starry-night.png"
             x="-80" y="-60"
             width="1160"
             height="720"
             filter="url(#skyFlow)"/>
    </g>

  </g>

</svg>

<div class="label">
  <div class="pill">Starry Night, Alive</div>
</div>

</section>

<div class="spacer">If this shows, the issue was bounding-box clipping.</div>

</body>
</html>
